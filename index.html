<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Price Game Calculator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            color: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 10px;
            padding: 32px;
            width: 100%;
            max-width: 380px;
            margin: 16px;
            position: relative;
        }

        .lang-toggle {
            position: absolute;
            top: 14px;
            right: 14px;
            display: flex;
            gap: 4px;
        }

        .lang-toggle button {
            width: auto;
            padding: 4px 10px;
            font-size: 0.75rem;
            background: #0f3460;
            border-radius: 4px;
        }

        .lang-toggle button.active {
            background: #e94560;
        }

        .lang-toggle button:hover { background: #c73652; }

        h1 {
            text-align: center;
            font-size: 1.4rem;
            margin-bottom: 6px;
            color: #e94560;
        }

        .subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 24px;
        }

        .prices {
            background: #0f3460;
            border-radius: 6px;
            padding: 10px 14px;
            margin-bottom: 20px;
            font-size: 0.82rem;
            color: #ccc;
            display: flex;
            justify-content: space-between;
        }

        .prices span { color: #e94560; font-weight: bold; }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: #aaa;
        }

        select, input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #0f3460;
            border-radius: 6px;
            background: #1a1a2e;
            color: #eee;
            font-size: 1rem;
            margin-bottom: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover { background: #c73652; }

        .result {
            margin-top: 20px;
            text-align: center;
            font-size: 1rem;
            min-height: 24px;
        }

        .result .value {
            font-size: 2rem;
            font-weight: bold;
            color: #e94560;
        }

        .result .label {
            font-size: 0.85rem;
            color: #aaa;
            margin-top: 4px;
        }

        .result .message {
            margin-top: 12px;
            font-size: 0.9rem;
            font-style: italic;
            color: #ffd700;
        }

        .error { color: #ff6b6b; font-size: 0.9rem; }

        footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #0f3460;
            text-align: center;
            font-size: 0.78rem;
            color: #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        footer a {
            color: #aaa;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        footer a:hover svg { fill: #fff; }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-toggle">
            <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
            <button id="btn-pt" onclick="setLang('pt')">PT</button>
        </div>

        <h1 data-i18n="title"></h1>
        <p class="subtitle" data-i18n="subtitle"></p>

        <div class="prices">
            <div>BRL <span>R$ 399</span></div>
            <div>USD <span>$ 70</span></div>
            <div>EUR <span>€ 70</span></div>
        </div>

        <label for="currency" data-i18n="labelCurrency"></label>
        <select id="currency">
            <option value="BRL" data-i18n="optBRL"></option>
            <option value="USD" data-i18n="optUSD"></option>
            <option value="EUR" data-i18n="optEUR"></option>
        </select>

        <label for="amount" data-i18n="labelAmount"></label>
        <input type="number" id="amount" min="0" step="0.01" inputmode="decimal">

        <button id="btn-convert" onclick="calculate()"></button>

        <div id="result" class="result"></div>

        <footer>
            <span>Developed by Natan Dias</span>
            <a href="https://github.com/natan-dias" target="_blank" rel="noopener" aria-label="GitHub profile">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#aaa">
                    <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0 1 12 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
                </svg>
            </a>
        </footer>
    </div>

    <script>
        const i18n = {
            en: {
                title: 'Full Price Game Calculator',
                subtitle: 'How many full-price games is that worth?',
                labelCurrency: 'Currency',
                labelAmount: 'Price of the item',
                optBRL: 'BRL — Brazilian Real',
                optUSD: 'USD — US Dollar',
                optEUR: 'EUR — Euro',
                btnConvert: 'Convert',
                placeholder: 'e.g. 20',
                errorAmount: 'Please enter a valid amount.',
                errorServer: 'Could not reach the server.',
                resultLabel: (amount, currency, result) => `${amount} ${currency} = ${result} Full Price Game(s)`,
                msgBelow: 'This product not even cost One game, so you should be fine to spend.',
                msgAbove: 'This product costs MORE than one game. Are you sure you are going to spend that?',
            },
            pt: {
                title: 'Full Price Game Calculator',
                subtitle: 'Quantos jogos isso vale?',
                labelCurrency: 'Moeda',
                labelAmount: 'Preço do item',
                optBRL: 'BRL — Real Brasileiro',
                optUSD: 'USD — Dólar Americano',
                optEUR: 'EUR — Euro',
                btnConvert: 'Converter',
                placeholder: 'ex: 20',
                errorAmount: 'Por favor insira um valor válido.',
                errorServer: 'Não foi possível conectar ao servidor.',
                resultLabel: (amount, currency, result) => `${amount} ${currency} = ${result} Jogo(s) de Preço Cheio`,
                msgBelow: 'Esse produto não custa nem um jogo, então pode gastar sem culpa.',
                msgAbove: 'Esse produto custa MAIS do que um jogo. Tem certeza que vai gastar isso?',
            },
        };

        let lang = 'en';

        function setLang(l) {
            lang = l;
            document.documentElement.lang = l;
            document.getElementById('btn-en').classList.toggle('active', l === 'en');
            document.getElementById('btn-pt').classList.toggle('active', l === 'pt');

            const t = i18n[l];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key] !== undefined) el.textContent = t[key];
            });
            document.getElementById('btn-convert').textContent = t.btnConvert;
            document.getElementById('amount').placeholder = t.placeholder;

            document.getElementById('result').innerHTML = '';
        }

        function calculate() {
            const currency = document.getElementById('currency').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const resultEl = document.getElementById('result');
            const t = i18n[lang];

            if (isNaN(amount) || amount <= 0) {
                resultEl.innerHTML = `<span class="error">${t.errorAmount}</span>`;
                return;
            }

            const prices = { BRL: 399, USD: 70, EUR: 70 };
            const result = Math.round((amount / prices[currency]) * 100) / 100;
            const message = result < 1 ? t.msgBelow : t.msgAbove;
            resultEl.innerHTML = `
                <div class="value">${result} FPG</div>
                <div class="label">${t.resultLabel(amount, currency, result)}</div>
                <div class="message">${message}</div>
            `;
        }

        setLang('en');
    </script>
</body>
</html>
